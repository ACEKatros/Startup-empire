```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sky Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    background: linear-gradient(#6ec6ff, #dff6ff);
    font-family: Arial;
    overflow: hidden;
    text-align: center;
}

canvas {
    display: block;
    margin: auto;
    background: transparent;
    border: 3px solid #222;
}

#ui {
    position: absolute;
    width: 100%;
    top: 10px;
    color: white;
    text-shadow: 1px 1px 3px black;
}

button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

#shop {
    display: none;
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    color: white;
}
</style>
</head>
<body>

<div id="ui">
<h2>Sky Rush</h2>
<p id="info">Click / Space to fly</p>
<button onclick="openShop()">Shop</button>
<button onclick="resetGame()">Restart</button>
</div>

<div id="shop">
<h3>Shop</h3>
<p>Coins: <span id="coinsDisplay">0</span></p>
<button onclick="buySkin('yellow',10)">Yellow Bird (10)</button>
<button onclick="buySkin('red',20)">Red Bird (20)</button>
<button onclick="buySkin('blue',30)">Blue Bird (30)</button>
<br><br>
<button onclick="closeShop()">Close</button>
</div>

<canvas id="game" width="420" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let bird = { x: 100, y: 250, vel: 0, r: 16, color: "yellow" };
let gravity = 0.5;
let jump = -8;

let pipes = [];
let coins = 0;
let score = 0;
let best = localStorage.getItem("bestSky") || 0;
let ownedSkins = JSON.parse(localStorage.getItem("skins") || '["yellow"]');

let gameState = "menu";
let frame = 0;

const sounds = {
    jump: new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"),
    score: new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg"),
    hit: new Audio("https://actions.google.com/sounds/v1/impacts/crash.ogg")
};

function play(s){ sounds[s].play(); }

function flap(){
    if(gameState !== "playing"){
        gameState = "playing";
        return;
    }
    bird.vel = jump;
    play("jump");
}

document.addEventListener("keydown", e => {
    if(e.code === "Space") flap();
});

c.addEventListener("click", flap);
c.addEventListener("touchstart", e => { e.preventDefault(); flap(); });

function spawnPipe(){
    let gap = 140;
    let top = Math.random()*200 + 80;

    pipes.push({
        x: 420,
        top: top,
        bottom: top + gap,
        passed: false
    });
}

function update(){
    if(gameState !== "playing") return;

    frame++;

    bird.vel += gravity;
    bird.y += bird.vel;

    if(frame % 90 === 0) spawnPipe();

    for(let p of pipes){
        p.x -= 3.5;

        if(!p.passed && p.x < bird.x){
            score++;
            coins++;
            p.passed = true;
            play("score");
        }

        if(
            bird.x + bird.r > p.x &&
            bird.x - bird.r < p.x + 60 &&
            (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom)
        ){
            die();
        }
    }

    pipes = pipes.filter(p => p.x > -80);

    if(bird.y > 600 || bird.y < 0){
        die();
    }

    if(score > best){
        best = score;
        localStorage.setItem("bestSky", best);
    }

    document.getElementById("coinsDisplay").innerText = coins;
}

function die(){
    gameState = "dead";
    play("hit");
}

function resetGame(){
    bird.y = 250;
    bird.vel = 0;
    pipes = [];
    score = 0;
    frame = 0;
    gameState = "playing";
}

function draw(){
    ctx.clearRect(0,0,420,600);

    // bird
    ctx.fillStyle = bird.color;
    ctx.beginPath();
    ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);
    ctx.fill();

    // pipes
    ctx.fillStyle = "green";
    for(let p of pipes){
        ctx.fillRect(p.x,0,60,p.top);
        ctx.fillRect(p.x,p.bottom,60,600);
    }

    // score
    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText("Score: " + score, 10, 30);
    ctx.fillText("Best: " + best, 10, 60);

    if(gameState === "menu"){
        ctx.fillText("Click to Start", 140, 300);
    }

    if(gameState === "dead"){
        ctx.fillText("Game Over", 150, 300);
        ctx.fillText("Click Restart", 130, 340);
    }
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

// SHOP
function openShop(){
    document.getElementById("shop").style.display = "block";
}
function closeShop(){
    document.getElementById("shop").style.display = "none";
}

function buySkin(color, cost){
    if(coins >= cost && !ownedSkins.includes(color)){
        coins -= cost;
        ownedSkins.push(color);
        localStorage.setItem("skins", JSON.stringify(ownedSkins));
        bird.color = color;
    } else {
        alert("Not enough coins or already owned!");
    }
}
</script>

</body>
</html>
