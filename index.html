```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flappy Bird Clone</title>
<style>
body{
    margin:0;
    background:#70c5ce;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
}
canvas{
    border:4px solid #222;
    max-width:100%;
    background:linear-gradient(#70c5ce,#bdefff);
}
</style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let state="menu";

const bird={
    x:100,
    y:250,
    r:18,
    vel:0,
    gravity:0.5,
    jump:-8
};

let pipes=[];
let score=0;
let best=localStorage.getItem("flappyBest")||0;
let frame=0;

function resetGame(){
    bird.y=250;
    bird.vel=0;
    pipes=[];
    score=0;
    frame=0;
    state="playing";
}

function flap(){
    if(state==="menu"){
        resetGame();
        return;
    }
    if(state==="gameover"){
        resetGame();
        return;
    }
    bird.vel=bird.jump;
}

document.addEventListener("keydown",e=>{
    if(e.code==="Space") flap();
});

canvas.addEventListener("mousedown",flap);
canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    flap();
});

function spawnPipe(){
    const gap=150;
    const top=Math.random()*250+50;

    pipes.push({
        x:canvas.width,
        top:top,
        bottom:top+gap,
        scored:false
    });
}

function update(){

    if(state!=="playing") return;

    frame++;

    bird.vel+=bird.gravity;
    bird.y+=bird.vel;

    if(frame%90===0){
        spawnPipe();
    }

    for(let i=pipes.length-1;i>=0;i--){
        let p=pipes[i];
        p.x-=3.5;

        if(!p.scored && p.x+60<bird.x){
            score++;
            p.scored=true;
        }

        if(
            bird.x+bird.r>p.x &&
            bird.x-bird.r<p.x+60 &&
            (
                bird.y-bird.r<p.top ||
                bird.y+bird.r>p.bottom
            )
        ){
            gameOver();
        }

        if(p.x<-70){
            pipes.splice(i,1);
        }
    }

    if(bird.y+bird.r>canvas.height || bird.y-bird.r<0){
        gameOver();
    }
}

function gameOver(){
    state="gameover";

    if(score>best){
        best=score;
        localStorage.setItem("flappyBest",best);
    }
}

function drawBackground(){
    ctx.fillStyle="#70c5ce";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="rgba(255,255,255,.4)";
    for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.arc((i*100+(frame*.3)%500)%500,80+i*20,25,0,Math.PI*2);
        ctx.fill();
    }
}

function drawBird(){
    ctx.save();

    ctx.translate(bird.x,bird.y);
    ctx.rotate(Math.min(bird.vel*0.05,0.8));

    ctx.fillStyle="gold";
    ctx.beginPath();
    ctx.arc(0,0,bird.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="orange";
    ctx.fillRect(10,-4,14,8);

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(5,-5,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(7,-5,2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawPipes(){
    ctx.fillStyle="#2ecc71";

    pipes.forEach(p=>{
        ctx.fillRect(p.x,0,60,p.top);
        ctx.fillRect(p.x,p.bottom,60,canvas.height-p.bottom);
    });
}

function drawText(){
    ctx.fillStyle="white";
    ctx.textAlign="center";

    if(state==="menu"){
        ctx.font="40px Arial";
        ctx.fillText("Flappy Bird",200,180);

        ctx.font="22px Arial";
        ctx.fillText("Click or Press Space",200,240);

        ctx.font="18px Arial";
        ctx.fillText("Best: "+best,200,290);
    }

    if(state==="playing"){
        ctx.font="40px Arial";
        ctx.fillText(score,200,80);
    }

    if(state==="gameover"){
        ctx.font="42px Arial";
        ctx.fillText("Game Over",200,220);

        ctx.font="26px Arial";
        ctx.fillText("Score: "+score,200,280);

        ctx.fillText("Best: "+best,200,320);

        ctx.font="20px Arial";
        ctx.fillText("Click to Restart",200,380);
    }
}

function draw(){
    drawBackground();
    drawPipes();
    drawBird();
    drawText();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
